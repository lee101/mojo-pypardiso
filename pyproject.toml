[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pypardiso"
version = "0.1.0"
description = "Mojo port of the pypardiso sparse direct solver"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy", "scipy"]

[project.urls]
Repository = "https://github.com/lee101/mojo-pypardiso"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]