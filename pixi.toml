[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-pypardiso"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock -w 900 /tmp/mojo-bench.lock python bench/bench.py"
# Same benchmark without the machine-wide lock, for when the shared lock is held
# by a long-running job in another checkout.
bench-nolock = "python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
python = "3.13.*"
pytest = "*"
numpy = "*"
scipy = "*"
pypardiso = "*"
max = "==26.7.0.dev2026092605"
